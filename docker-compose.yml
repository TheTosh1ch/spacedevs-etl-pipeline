x-airflow-common: &airflow-common
  image: iceberg-lab-airflow:latest
  build:
    context: ./docker/airflow
  depends_on:
    airflow-postgres:
      condition: service_healthy
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
    AWS_REGION: us-east-1
    AIRFLOW_CONN_MINIOS3_CONN: "aws://minioadmin:minioadmin@?endpoint_url=http%3A%2F%2Fminio%3A9000"
    CLICKHOUSE_HOST: host.docker.internal
    CLICKHOUSE_PORT: '8125'
    POSTGRES_HOST: host.docker.internal
    POSTGRES_PORT: '5432'
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    AIRFLOW__WEBSERVER__SHOW_TRIGGER_FORM_IF_NO_PARAMS: 'true'
  volumes: &airflow-volumes
    - ./dags:/opt/airflow/dags
    - ./spark_jobs:/opt/airflow/spark_jobs
    - ./lib:/opt/airflow/lib
    - ./work:/opt/airflow/work
    - airflow-logs:/opt/airflow/logs
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  # ─────────────────────────── Storage ───────────────────────────
  minio:
    image: pgsty/silo:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  mc:
    image: pgsty/silo:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio';
        sleep 2;
      done;
      mc mb local/lakehouse --ignore-existing;
      exit 0;
      "

  # ─────────────────────────── Iceberg ───────────────────────────
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: iceberg-rest
    depends_on:
      - minio
      - mc
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://lakehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: minioadmin
      CATALOG_S3_SECRET__ACCESS__KEY: minioadmin
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1

  # ─────────────────────────── Query engine ──────────────────────
  jupyter:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.3
    container_name: jupyter
    depends_on:
      - iceberg-rest
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      AWS_REGION: us-east-1
      JUPYTER_ENABLE_LAB: "yes"
      TRINO_URL: http://trino:8080
      TRINO_USER: jupyter
    volumes:
      - ./work:/home/jovyan/work
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''

  trino:
    image: trinodb/trino:latest
    container_name: trino
    depends_on:
      - iceberg-rest
    ports:
      - "8085:8080"
    volumes:
      - ./trino/etc:/etc/trino
      - ./trino/catalog:/etc/trino/catalog
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─────────────────────────── Orchestration ─────────────────────
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
        echo "Airflow initialized."

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8090:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  minio-data:
  airflow-db-data:
  airflow-logs: